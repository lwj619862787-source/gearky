    <circle cx="82" cy="408" r="17" fill="#2a4f9e"/>
    <text x="82" y="414" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
    <text x="116" y="414" font-family="Inter, Arial, sans-serif" font-size="17" fill="#ffffff">TxK</text>
    <text x="600" y="414" font-family="Inter, Arial, sans-serif" font-size="14" fill="#8fb3ff">tube shooter</text>
