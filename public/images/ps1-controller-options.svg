<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0e1a30"/>
  <text x="40" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">Three ways to get a PS1 controller</text>
  <text x="40" y="86" font-family="Inter, Arial, sans-serif" font-size="16" fill="#98a2b3">Pick based on what you actually want to do</text>

  <!-- USB remake -->
  <g>
    <rect x="40" y="112" width="350" height="130" rx="14" fill="#155eef"/>
    <text x="70" y="152" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">USB remake controller</text>
    <text x="70" y="214" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">$12 – $24</text>
    <text x="70" y="236" font-family="Inter, Arial, sans-serif" font-size="14" fill="#d6e4ff">plug-and-play on PC</text>
  </g>

  <!-- Adapter -->
  <g>
    <rect x="410" y="112" width="350" height="130" rx="14" fill="#132447"/>
    <text x="440" y="152" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">USB adapter</text>
    <text x="440" y="214" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">$7 – $10</text>
    <text x="440" y="236" font-family="Inter, Arial, sans-serif" font-size="14" fill="#8fb3ff">use your original pad on PC</text>
  </g>

  <!-- Original collecting -->
  <g>
    <rect x="40" y="258" width="350" height="130" rx="14" fill="#132447"/>
    <text x="70" y="298" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Original (collecting)</text>
    <text x="70" y="360" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">varies</text>
    <text x="70" y="382" font-family="Inter, Arial, sans-serif" font-size="14" fill="#8fb3ff">second-hand market price</text>
  </g>

  <!-- Tip -->
  <g>
    <rect x="410" y="258" width="350" height="130" rx="14" fill="#132447"/>
    <text x="440" y="298" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Quick tip</text>
    <text x="440" y="330" font-family="Inter, Arial, sans-serif" font-size="15" fill="#98a2b3">PS1 and PS2 use the same</text>
    <text x="440" y="356" font-family="Inter, Arial, sans-serif" font-size="15" fill="#98a2b3">controller port, so most</text>
    <text x="440" y="382" font-family="Inter, Arial, sans-serif" font-size="15" fill="#98a2b3">"PS2" adapters fit PS1 too</text>
  </g>
</svg>
