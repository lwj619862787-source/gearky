<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0e1a30"/>
  <text x="40" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">The retro design, explained</text>
  <text x="40" y="86" font-family="Inter, Arial, sans-serif" font-size="16" fill="#98a2b3">Why the 30th Anniversary pads are collector pieces</text>

  <!-- Grey body -->
  <g>
    <rect x="40" y="120" width="240" height="120" rx="14" fill="#8c8c8c"/>
    <text x="160" y="175" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0b1220" text-anchor="middle">Classic grey shell</text>
    <text x="160" y="202" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0b1220" text-anchor="middle">PS1-inspired body</text>
  </g>

  <!-- Color logo -->
  <g>
    <rect x="300" y="120" width="240" height="120" rx="14" fill="#132447"/>
    <g transform="translate(420, 180)">
      <path d="M-28,-8 L0,-28 L28,-8 L20,18 L8,6 L0,16 L-8,6 L-20,18 Z" fill="#e60012"/>
      <circle cx="-16" cy="-4" r="0" fill="#000"/>
    </g>
    <text x="420" y="150" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Color PS logo</text>
    <text x="420" y="226" font-family="Inter, Arial, sans-serif" font-size="14" fill="#98a2b3" text-anchor="middle">red · yellow · green · blue</text>
  </g>

  <!-- Limited -->
  <g>
    <rect x="560" y="120" width="200" height="120" rx="14" fill="#132447"/>
    <text x="660" y="170" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Limited run</text>
    <text x="660" y="198" font-family="Inter, Arial, sans-serif" font-size="14" fill="#8fb3ff" text-anchor="middle">now sold out</text>
  </g>

  <text x="40" y="300" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">What makes it a collector piece</text>
  <text x="40" y="330" font-family="Inter, Arial, sans-serif" font-size="15" fill="#98a2b3">The grey body, color PlayStation logo, and limited production make these pads</text>
  <text x="40" y="354" font-family="Inter, Arial, sans-serif" font-size="15" fill="#98a2b3">the most in-demand DualSense variants since launch — and they are no longer sold at retail.</text>
</svg>
