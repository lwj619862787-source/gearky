<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0e1a30"/>
  <text x="40" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">PS5 controller price tiers</text>
  <text x="40" y="86" font-family="Inter, Arial, sans-serif" font-size="16" fill="#98a2b3">What you can expect to pay in the US</text>

  <!-- Standard -->
  <g>
    <rect x="40" y="112" width="350" height="140" rx="14" fill="#132447"/>
    <text x="70" y="152" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Standard DualSense</text>
    <text x="70" y="214" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">$74.99</text>
    <text x="70" y="238" font-family="Inter, Arial, sans-serif" font-size="14" fill="#8fb3ff">white / Midnight Black</text>
  </g>

  <!-- Colored -->
  <g>
    <rect x="410" y="112" width="350" height="140" rx="14" fill="#132447"/>
    <text x="440" y="152" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Colored DualSense</text>
    <text x="440" y="214" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">$79.99</text>
    <text x="440" y="238" font-family="Inter, Arial, sans-serif" font-size="14" fill="#8fb3ff">Nova Pink, Cosmic Red, etc.</text>
  </g>

  <!-- Refurbished -->
  <g>
    <rect x="40" y="268" width="350" height="140" rx="14" fill="#155eef"/>
    <text x="70" y="308" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Certified refurbished</text>
    <text x="70" y="370" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">$59–$64</text>
    <text x="70" y="394" font-family="Inter, Arial, sans-serif" font-size="14" fill="#d6e4ff">PlayStation Direct</text>
  </g>

  <!-- Edge -->
  <g>
    <rect x="410" y="268" width="350" height="140" rx="14" fill="#132447"/>
    <text x="440" y="308" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">DualSense Edge</text>
    <text x="440" y="370" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">$199.99</text>
    <text x="440" y="394" font-family="Inter, Arial, sans-serif" font-size="14" fill="#8fb3ff">pro-grade controller</text>
  </g>
</svg>
