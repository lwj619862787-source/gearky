<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0e1a30"/>
  <text x="40" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">How to buy PS Vita games now</text>
  <text x="40" y="86" font-family="Inter, Arial, sans-serif" font-size="16" fill="#98a2b3">Digital store still works, but physical cartridges dominate</text>

  <!-- Digital -->
  <g>
    <rect x="40" y="120" width="350" height="250" rx="16" fill="#132447"/>
    <rect x="40" y="120" width="350" height="6" rx="3" fill="#2a4f9e"/>
    <text x="70" y="166" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Digital store</text>
    <text x="70" y="194" font-family="Inter, Arial, sans-serif" font-size="15" fill="#98a2b3">PS Vita PSN storefront</text>
    <text x="70" y="232" font-family="Inter, Arial, sans-serif" font-size="15" fill="#8fb3ff">Still open, but...</text>
    <text x="70" y="258" font-family="Inter, Arial, sans-serif" font-size="15" fill="#ffffff">No direct card payment</text>
    <text x="70" y="284" font-family="Inter, Arial, sans-serif" font-size="15" fill="#ffffff">Add funds via PS4 / PS5 / web</text>
    <text x="70" y="310" font-family="Inter, Arial, sans-serif" font-size="15" fill="#ffffff">Many indie titles still listed</text>
  </g>

  <!-- Physical -->
  <g>
    <rect x="410" y="120" width="350" height="250" rx="16" fill="#155eef"/>
    <text x="440" y="166" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Physical cartridges</text>
    <text x="440" y="194" font-family="Inter, Arial, sans-serif" font-size="15" fill="#d6e4ff">Second-hand market</text>
    <text x="440" y="232" font-family="Inter, Arial, sans-serif" font-size="15" fill="#d6e4ff">eBay / Amazon / local</text>
    <text x="440" y="258" font-family="Inter, Arial, sans-serif" font-size="15" fill="#ffffff">Common games stay cheap</text>
    <text x="440" y="284" font-family="Inter, Arial, sans-serif" font-size="15" fill="#ffffff">Rare titles climb fast</text>
    <text x="440" y="310" font-family="Inter, Arial, sans-serif" font-size="15" fill="#ffffff">e.g. Velocity 2X, TxK carts</text>
  </g>
</svg>
